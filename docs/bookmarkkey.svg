<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Keycap bookmark emoji</title>
  <desc>Bookmark keycap emoji, red rounded square with white bookmark</desc>

  <!-- Black sticker outline -->
  <rect x="40" y="40" width="600" height="600" rx="120" fill="black"/>

  <!-- Dark red bottom/right shadow -->
  <rect x="55" y="65" width="570" height="560" rx="105" fill="#991b1b"/>

  <!-- Light red top/left highlight -->
  <rect x="55" y="55" width="550" height="550" rx="100" fill="#f87171"/>

  <!-- Main red body -->
  <rect x="80" y="80" width="510" height="510" rx="90" fill="#ef4444"/>

  <!-- Tabler bookmark icon, scaled and centered -->
  <g transform="translate(100, 100) scale(20)">
    <path d="M9 4h6a2 2 0 0 1 2 2v14l-5-3l-5 3V6a2 2 0 0 1 2-2"
          fill="white" stroke="white" stroke-width="0.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>