<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Keycap question mark emoji</title>
  <desc>Question mark keycap emoji, orange rounded square with white question mark</desc>

  <!-- Black sticker outline -->
  <rect x="40" y="40" width="600" height="600" rx="120" fill="black"/>

  <!-- Dark orange bottom/right shadow -->
  <rect x="55" y="65" width="570" height="560" rx="105" fill="#9a3412"/>

  <!-- Light orange top/left highlight -->
  <rect x="55" y="55" width="550" height="550" rx="100" fill="#fdba74"/>

  <!-- Main orange body -->
  <rect x="80" y="80" width="510" height="510" rx="90" fill="#f97316"/>

  <!-- White question mark -->
  <text x="340" y="500"
        font-family="Arial, sans-serif"
        font-size="420"
        font-weight="bold"
        fill="white"
        text-anchor="middle">?</text>

</svg>