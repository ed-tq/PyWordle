<svg width="100%" viewBox="0 0 680 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Keycap play emoji</title>
  <desc>Play keycap emoji, green rounded square with white play triangle</desc>

  <!-- Black sticker outline -->
  <rect x="40" y="40" width="600" height="600" rx="120" fill="black"/>

  <!-- Dark green bottom/right shadow -->
  <rect x="55" y="65" width="570" height="560" rx="105" fill="#14532d"/>

  <!-- Light green top/left highlight -->
  <rect x="55" y="55" width="550" height="550" rx="100" fill="#86efac"/>

  <!-- Main green body -->
  <rect x="80" y="80" width="510" height="510" rx="90" fill="#22c55e"/>

  <!-- White play arrow -->
  <text x="340" y="500"
        font-family="Arial, sans-serif"
        font-size="420"
        fill="white"
        text-anchor="middle">&#9654;</text>

</svg>